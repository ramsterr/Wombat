name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test (race)
        run: go test -race ./internal/agent ./internal/orchestrator ./internal/tools ./internal/checkpoint ./internal/worktree ./internal/llm ./internal/eval ./internal/release
      - name: build
        run: go build ./...
      - name: eval tasks
        run: go run ./cmd/eval -tasks eval/tasks -dry-run
      - name: probe continue-on-error
        continue-on-error: true
        run: exit 1
      - name: check the tap secret
        env:
          TAP: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the Homebrew tap will not be updated"
          else
            echo "HOMEBREW_TAP_TOKEN is present"
          fi

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          args: check
