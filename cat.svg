<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- ears -->
  <polygon points="70,90 60,30 120,70" fill="#f4a261"/>
  <polygon points="230,90 240,30 180,70" fill="#f4a261"/>
  <polygon points="75,80 68,45 110,70" fill="#e76f51"/>
  <polygon points="225,80 232,45 190,70" fill="#e76f51"/>
  <!-- head -->
  <circle cx="150" cy="140" r="80" fill="#f4a261"/>
  <!-- eyes -->
  <ellipse cx="120" cy="130" rx="14" ry="18" fill="#2b2b2b"/>
  <ellipse cx="180" cy="130" rx="14" ry="18" fill="#2b2b2b"/>
  <circle cx="124" cy="124" r="4" fill="#ffffff"/>
  <circle cx="184" cy="124" r="4" fill="#ffffff"/>
  <!-- nose -->
  <polygon points="150,150 142,160 158,160" fill="#e76f51"/>
  <!-- mouth -->
  <path d="M150 160 Q120 180 105 165" stroke="#2b2b2b" stroke-width="3" fill="none"/>
  <path d="M150 160 Q180 180 195 165" stroke="#2b2b2b" stroke-width="3" fill="none"/>
  <!-- whiskers -->
  <line x1="60" y1="145" x2="110" y2="150" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="60" y1="160" x2="110" y2="160" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="240" y1="145" x2="190" y2="150" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="240" y1="160" x2="190" y2="160" stroke="#2b2b2b" stroke-width="2"/>
</svg>
