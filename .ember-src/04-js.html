<script>
(function(){
  "use strict";
  var root = document.documentElement;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Nav state + scroll progress */
  var nav = document.getElementById("nav");
  var sentinel = document.getElementById("heroSentinel");
  var bar = document.querySelector(".progress__bar");
  if (sentinel && "IntersectionObserver" in window) {
    new IntersectionObserver(function(entries){
      nav.classList.toggle("is-stuck", !entries[0].isIntersecting);
    }, {threshold:0}).observe(sentinel);
  } else if (nav) {
    nav.classList.add("is-stuck");
  }
  if (bar) {
    var ticking = false;
    var paint = function(){
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, h.scrollTop / max) : 0) + ")";
      ticking = false;
    };
    window.addEventListener("scroll", function(){
      if (!ticking) { ticking = true; requestAnimationFrame(paint); }
    }, {passive:true});
    paint();
  }

  /* Reveal on scroll */
  var revealEls = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
  if (!reduce && "IntersectionObserver" in window) {
    var reveal = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) {
          entry.target.classList.add("is-in");
          reveal.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:"0px 0px -8% 0px"});
    revealEls.forEach(function(el){ reveal.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add("is-in"); });
  }

  /* Active section in nav */
  var links = Array.prototype.slice.call(document.querySelectorAll(".nav__link"));
  var targets = links.map(function(link){ return document.querySelector(link.getAttribute("href")); }).filter(Boolean);
  if ("IntersectionObserver" in window && targets.length) {
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        var id = "#" + entry.target.id;
        links.forEach(function(link){
          if (link.getAttribute("href") === id) link.setAttribute("aria-current", "true");
          else link.removeAttribute("aria-current");
        });
      });
    }, {rootMargin:"-45% 0px -50% 0px", threshold:0});
    targets.forEach(function(t){ spy.observe(t); });
  }

  /* Ticker pause */
  var ticker = document.querySelector(".ticker");
  var pause = document.querySelector(".ticker__pause");
  if (ticker && pause) {
    pause.addEventListener("click", function(){
      var paused = ticker.classList.toggle("is-paused");
      pause.setAttribute("aria-pressed", String(paused));
      pause.setAttribute("aria-label", paused ? "Play ticker" : "Pause ticker");
      pause.innerHTML = paused
        ? '<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>'
        : '<svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1" width="2.2" height="8"/><rect x="6.3" y="1" width="2.2" height="8"/></svg>';
    });
  }

  /* Tasting-note dialogs */
  var lastTrigger = null;
  Array.prototype.forEach.call(document.querySelectorAll("[data-dialog]"), function(btn){
    btn.addEventListener("click", function(){
      var dlg = document.getElementById(btn.getAttribute("data-dialog"));
      if (!dlg) return;
      lastTrigger = btn;
      if (typeof dlg.showModal === "function") dlg.showModal();
      else dlg.setAttribute("open", "");
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("dialog.lotdlg"), function(dlg){
    Array.prototype.forEach.call(dlg.querySelectorAll("[data-close]"), function(el){
      el.addEventListener("click", function(){
        if (typeof dlg.close === "function") dlg.close();
        else dlg.removeAttribute("open");
      });
    });
    dlg.addEventListener("close", function(){
      if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
    });
    dlg.addEventListener("click", function(e){
      if (e.target === dlg) dlg.close();
    });
  });

  /* Mobile menu */
  var menu = document.getElementById("menu");
  var openBtn = document.getElementById("menuOpen");
  var closeBtn = document.getElementById("menuClose");
  var focusBefore = null;
  function openMenu(){
    focusBefore = document.activeElement;
    menu.hidden = false;
    requestAnimationFrame(function(){ menu.classList.add("is-open"); });
    openBtn.setAttribute("aria-expanded", "true");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }
  function closeMenu(){
    menu.classList.remove("is-open");
    openBtn.setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
    window.setTimeout(function(){ menu.hidden = true; }, 280);
    if (focusBefore) { focusBefore.focus(); focusBefore = null; }
  }
  if (menu && openBtn && closeBtn) {
    openBtn.addEventListener("click", openMenu);
    closeBtn.addEventListener("click", closeMenu);
    menu.addEventListener("click", function(e){
      if (e.target.closest("a")) closeMenu();
    });
    document.addEventListener("keydown", function(e){
      if (menu.hidden) return;
      if (e.key === "Escape") { e.preventDefault(); closeMenu(); }
      if (e.key === "Tab") {
        var focusable = Array.prototype.slice.call(menu.querySelectorAll("a, button")).filter(function(el){
          return el.offsetParent !== null;
        });
        if (!focusable.length) return;
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
  }

  /* Subscription form — client-side only, no network */
  var form = document.getElementById("subForm");
  var success = document.getElementById("formSuccess");
  var email = document.getElementById("email");
  var error = document.getElementById("email-error");
  var status = document.getElementById("formStatus");
  var successText = document.getElementById("successText");
  var reset = document.getElementById("formReset");
  if (form && email && error && success) {
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var value = email.value.trim();
      var valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);
      if (!valid) {
        email.setAttribute("aria-invalid", "true");
        error.hidden = false;
        email.focus();
        return;
      }
      email.removeAttribute("aria-invalid");
      error.hidden = true;
      var cadence = form.querySelector('input[name="cadence"]:checked');
      var weeks = cadence ? cadence.value : "2";
      successText.textContent = "A welcome note is on its way to " + value + ". Your first two bags ship with the next roast, every " + weeks + " weeks. Pause or skip whenever you like.";
      form.hidden = true;
      success.hidden = false;
      success.querySelector("h4").setAttribute("tabindex", "-1");
      success.querySelector("h4").focus();
      if (status) status.textContent = "";
    });
    email.addEventListener("input", function(){
      if (email.getAttribute("aria-invalid") === "true" && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) {
        email.removeAttribute("aria-invalid");
        error.hidden = true;
      }
    });
    if (reset) reset.addEventListener("click", function(){
      success.hidden = true;
      form.hidden = false;
      email.value = "";
      email.focus();
    });
  }

  var year = document.getElementById("year");
  if (year) year.textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
