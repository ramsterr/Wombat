<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Way of Learning — The Timeless Art of Machine Learning</title>
  <meta name="description" content="Eighty-one chapters on the art and science of machine learning, after Lao Tzu. Each chapter is set beside a living artifact you can touch, tune, and reshape.">
  <meta name="theme-color" content="#FAF9F5">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F0EEE6'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%231F1E1D' stroke-width='1.6'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='%231F1E1D' stroke-width='1.2'/%3E%3Ccircle cx='32' cy='32' r='2' fill='%23D97757'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/book.css">
</head>
<body>
  <a class="skip" href="#book">Skip to the book</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top">The Way of Learning</a>
    <nav class="tools" aria-label="Book">
      <button type="button" class="tool" id="motionBtn" aria-pressed="true">Motion</button>
      <button type="button" class="tool" id="contentsBtn" aria-expanded="false" aria-controls="contents">Contents</button>
    </nav>
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
  </header>

  <main id="book" aria-label="The Way of Learning, eighty-one chapters">
    <noscript>
      <p class="noscript">This book renders its verses and living artifacts with JavaScript. Please enable it.</p>
    </noscript>
  </main>

  <section class="contents" id="contents" aria-label="Contents" hidden>
    <div class="contents-head">
      <p class="eyebrow">Contents</p>
      <button type="button" class="tool" id="contentsClose">Close</button>
    </div>
    <ol class="contents-grid" id="contentsGrid"></ol>
    <p class="contents-foot" id="contentsFoot">Eighty-one chapters</p>
  </section>

  <aside class="drawer" id="drawer" aria-label="Modify this artifact" aria-hidden="true">
    <div class="drawer-head">
      <p class="eyebrow" id="drawerEyebrow">Modify</p>
      <button type="button" class="tool" id="drawerClose">Close</button>
    </div>
    <h2 class="drawer-title" id="drawerTitle">Artifact</h2>
    <p class="drawer-spec" id="drawerSpec"></p>

    <div class="controls" id="drawerControls">
      <label class="control">
        <span class="control-row"><span>Tempo</span><output id="outTempo">1.00</output></span>
        <input type="range" id="pTempo" min="0" max="2" step="0.01" value="1">
      </label>
      <label class="control">
        <span class="control-row"><span>Density</span><output id="outDensity">1.00</output></span>
        <input type="range" id="pDensity" min="0.25" max="2" step="0.01" value="1">
      </label>
      <label class="control">
        <span class="control-row"><span>Drift</span><output id="outDrift">0.50</output></span>
        <input type="range" id="pDrift" min="0" max="1" step="0.01" value="0.5">
      </label>
      <button type="button" class="ghost" id="reseed">Begin again</button>
    </div>

    <p class="eyebrow drawer-prompts-label">Ways to change it</p>
    <ul class="prompts" id="drawerPrompts"></ul>
    <p class="drawer-note">Every artifact here is drawn from the chapter's themes. Nothing is fixed. Change a number, and the chapter changes with it.</p>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
